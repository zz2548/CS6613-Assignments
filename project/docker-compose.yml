version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  dev:
    build: .
    volumes:
      - .:/workspace
      - data:/data
    depends_on:
      - ollama
      - mongo
    environment:
      - OLLAMA_HOST=ollama:11434

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  ollama_data:
  mongo_data:
  data: